<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1532" viewBox="0 0 720 1532" role="img" aria-labelledby="title desc">
  <title id="title">Personal records — illustrated retrieval and a proposed support workflow</title>
  <desc id="desc">All dates, amounts and conversations are fictional. Owner-only record retrieval answers when a landscaper changed using a welcome email and reports an HVAC payment using a paid receipt. A separately labeled proposed support workflow combines an April fan purchase and an attached defect photo to prepare a draft for review. The support sequence is illustrative and no email is sent; life-index and related personal retrieval tools are read-only.</desc>
  <rect width="720" height="1532" rx="22" fill="#181F25"/>
  <rect x="0.5" y="0.5" width="719" height="1531" rx="21.5" fill="none" stroke="#35414B"/>
  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="400">
    <text x="40" y="62" font-size="34" font-weight="500" fill="#E7ECEF">Personal records</text>
    <text x="680" y="60" text-anchor="end" font-size="24" fill="#A6CDBE">Owner only</text>
    <text x="40" y="105" font-size="26" font-weight="400" fill="#AAB6BF">Fictional conversations · example data</text>
    <path d="M40 134H680" stroke="#35414B"/>
    <rect x="104" y="166" width="576" height="105" rx="18" fill="#253331" stroke="#35414B"/>
    <text x="128" y="199" font-size="22" font-weight="400" fill="#AAB6BF">You</text>
    <text x="128" y="244" font-size="28" font-weight="400" fill="#E7ECEF">When did we switch landscapers?</text>
    <rect x="40" y="295" width="576" height="145" rx="18" fill="#222A31" stroke="#35414B"/>
    <text x="64" y="328" font-size="22" font-weight="400" fill="#A6CDBE">Shadow</text>
    <text x="64" y="373" font-size="28" font-weight="400" fill="#E7ECEF">March 2025. The welcome email</text>
    <text x="64" y="413" font-size="28" font-weight="400" fill="#E7ECEF">says service started March 10.</text>
    <rect x="104" y="464" width="576" height="145" rx="18" fill="#253331" stroke="#35414B"/>
    <text x="128" y="497" font-size="22" font-weight="400" fill="#AAB6BF">You</text>
    <text x="128" y="542" font-size="28" font-weight="400" fill="#E7ECEF">What did I pay for the last</text>
    <text x="128" y="582" font-size="28" font-weight="400" fill="#E7ECEF">HVAC repair?</text>
    <rect x="40" y="633" width="576" height="145" rx="18" fill="#222A31" stroke="#35414B"/>
    <text x="64" y="666" font-size="22" font-weight="400" fill="#A6CDBE">Shadow</text>
    <text x="64" y="711" font-size="28" font-weight="400" fill="#E7ECEF">$480 on June 12, 2026.</text>
    <text x="64" y="751" font-size="28" font-weight="400" fill="#E7ECEF">Source: receipt marked paid.</text>
    <path d="M40 810H680" stroke="#35414B" stroke-dasharray="4 6"/>
    <text x="40" y="859" font-size="29" font-weight="500" fill="#A6CDBE">Proposed support workflow</text>
    <text x="40" y="899" font-size="26" font-weight="400" fill="#AAB6BF">Illustrative draft · no email sent</text>
    <rect x="104" y="928" width="576" height="287" rx="18" fill="#253331" stroke="#35414B"/>
    <text x="128" y="961" font-size="22" font-weight="400" fill="#AAB6BF">You</text>
    <text x="128" y="1006" font-size="28" font-weight="400" fill="#E7ECEF">Email support about the fan</text>
    <text x="128" y="1046" font-size="28" font-weight="400" fill="#E7ECEF">I bought in April.</text>
    <rect x="128" y="1073" width="528" height="120" rx="12" fill="#181F25" stroke="#35414B"/>
    <g transform="translate(150 1094)" fill="none" stroke="#AAB6BF" stroke-width="1.8"><rect width="70" height="76" rx="8"/><circle cx="35" cy="32" r="21"/><path d="M35 11v42M14 32h42M35 53v12M21 65h28"/><path d="m57 4-8 15 11 9-9 12" stroke="#A6CDBE" stroke-width="2.5"/></g>
    <text x="246" y="1119" font-size="24" font-weight="400" fill="#AAB6BF">Attached photo</text>
    <text x="246" y="1156" font-size="26" font-weight="400" fill="#E7ECEF">Cracked housing</text>
    <rect x="40" y="1239" width="576" height="185" rx="18" fill="#222A31" stroke="#35414B"/>
    <text x="64" y="1272" font-size="22" font-weight="400" fill="#A6CDBE">Shadow · proposed</text>
    <text x="64" y="1317" font-size="28" font-weight="400" fill="#E7ECEF">Draft ready for review.</text>
    <text x="64" y="1357" font-size="28" font-weight="400" fill="#E7ECEF">Includes the purchase details</text>
    <text x="64" y="1397" font-size="28" font-weight="400" fill="#E7ECEF">and the attached defect photo.</text>
    <path d="M40 1452H680" stroke="#35414B"/>
    <text x="40" y="1496" font-size="26" font-weight="400" fill="#AAB6BF">Illustrated · personal access only</text>
  </g>
</svg>
