<svg xmlns="http://www.w3.org/2000/svg" width="720" height="980" viewBox="0 0 720 980" role="img" aria-labelledby="title desc">
  <title id="title">From a fridge video to a shared list</title>
  <desc id="desc">Illustrated grocery workflow: a person sends a video and asks to add strawberry yogurt, with plain yogurt as a fallback. OpenClaw and ShadowOS interpret the request in context. The shared list stores strawberry yogurt with the fallback as a note. Recognition and wording are illustrated.</desc>
  <rect x="1" y="1" width="718" height="978" rx="20" fill="#F7F6F2" stroke="#D7DFDA" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="61" font-size="36" font-weight="700" fill="#172D3A">From a fridge video</text>
    <text x="40" y="106" font-size="36" font-weight="700" fill="#172D3A">to a shared list</text>
    <text x="40" y="148" font-size="28" fill="#51636A">Text · voice · images · short video</text>
    <rect x="40" y="184" width="640" height="218" rx="20" fill="#FFFFFF" stroke="#D7DFDA" stroke-width="2"/>
    <circle cx="77" cy="224" r="18" fill="#C9E5DD"/>
    <text x="77" y="232" text-anchor="middle" font-size="23" font-weight="700" fill="#172D3A">1</text>
    <text x="112" y="235" font-size="32" font-weight="700" fill="#172D3A">Send an update</text>
    <text x="72" y="284" font-size="28" fill="#51636A">Fridge video + narration</text>
    <text x="72" y="333" font-size="28" fill="#172D3A">“Add this strawberry yogurt.</text>
    <text x="72" y="369" font-size="28" fill="#172D3A">If unavailable, plain yogurt is fine.”</text>
    <path d="M360 408v28m-7-7 7 7 7-7" fill="none" stroke="#246D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="446" width="640" height="170" rx="20" fill="#FFFFFF" stroke="#D7DFDA" stroke-width="2"/>
    <circle cx="77" cy="485" r="18" fill="#C9E5DD"/>
    <text x="77" y="493" text-anchor="middle" font-size="23" font-weight="700" fill="#172D3A">2</text>
    <text x="112" y="497" font-size="32" font-weight="700" fill="#172D3A">Read it in context</text>
    <text x="72" y="547" font-size="28" fill="#51636A">OpenClaw + ShadowOS</text>
    <text x="72" y="588" font-size="28" fill="#172D3A">The current task + your instructions</text>
    <path d="M360 622v28m-7-7 7 7 7-7" fill="none" stroke="#246D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="660" width="640" height="196" rx="20" fill="#C9E5DD" stroke="#D7DFDA" stroke-width="2"/>
    <circle cx="77" cy="699" r="18" fill="#FFFFFF"/>
    <text x="77" y="707" text-anchor="middle" font-size="23" font-weight="700" fill="#172D3A">3</text>
    <text x="112" y="711" font-size="32" font-weight="700" fill="#172D3A">Update the shared list</text>
    <text x="72" y="763" font-size="30" font-weight="700" fill="#172D3A">Strawberry yogurt</text>
    <text x="72" y="806" font-size="28" fill="#172D3A">Note: plain yogurt if unavailable</text>
    <text x="40" y="911" font-size="28" fill="#51636A">Keep chatting: mark bought,</text>
    <text x="40" y="951" font-size="28" fill="#51636A">correct an item, or ask about history.</text>
  </g>
</svg>
