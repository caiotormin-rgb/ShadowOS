<title id="title">Purchase support — illustrated chat</title>
<desc id="desc">You · photo: Email support about this defect. It’s the fan I bought in April. Shadow: Found the April 18 order and customer support contact. Extracted the serial number, described the defect from your photo and sent the inquiry. You: Which order was that again? Shadow: Example Air desk fan. Order EXAMPLE-0418. Shadow · later: Support replied. They asked for proof of purchase to review repair or replacement options.</desc>
