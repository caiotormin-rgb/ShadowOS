<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1182" viewBox="0 0 720 1182" role="img" aria-labelledby="title desc">
  <title id="title">Doctor — an illustrated search confirmation</title>
  <desc id="desc">Fictional example with a fictional insurance plan. A person requests a dermatologist near 10001 on weekday mornings. Shadow asks about radius, confirms dermatology, 10 miles, weekday mornings and ExamplePlan, then waits for explicit approval to search. Doctor is in early testing; outreach requires human approval. No appointment is booked.</desc>
  <rect width="720" height="1182" rx="22" fill="#181F25"/>
  <rect x="0.5" y="0.5" width="719" height="1181" rx="21.5" fill="none" stroke="#35414B"/>
  <g font-family="Geist" font-weight="400">
    <text x="40" y="62" font-size="34" font-weight="500" fill="#E7ECEF">Doctor</text>
    <text x="680" y="60" text-anchor="end" font-size="24" fill="#A6CDBE">Early testing</text>
    <text x="40" y="105" font-size="26" font-weight="400" fill="#AAB6BF">Fictional conversation · confirmed search</text>
    <path d="M40 134H680" stroke="#35414B"/>
    <rect x="104" y="166" width="576" height="145" rx="18" fill="#253331" stroke="#35414B"/>
    <text x="128" y="199" font-size="22" font-weight="400" fill="#AAB6BF">You</text>
    <text x="128" y="244" font-size="28" font-weight="400" fill="#E7ECEF">Find a dermatologist for me</text>
    <text x="128" y="284" font-size="28" font-weight="400" fill="#E7ECEF">near 10001. Weekday mornings.</text>
    <rect x="40" y="335" width="576" height="145" rx="18" fill="#222A31" stroke="#35414B"/>
    <text x="64" y="368" font-size="22" font-weight="400" fill="#A6CDBE">Shadow</text>
    <text x="64" y="413" font-size="28" font-weight="400" fill="#E7ECEF">What search radius</text>
    <text x="64" y="453" font-size="28" font-weight="400" fill="#E7ECEF">would you prefer?</text>
    <rect x="104" y="504" width="576" height="105" rx="18" fill="#253331" stroke="#35414B"/>
    <text x="128" y="537" font-size="22" font-weight="400" fill="#AAB6BF">You</text>
    <text x="128" y="582" font-size="28" font-weight="400" fill="#E7ECEF">10 miles. ExamplePlan.</text>
    <rect x="40" y="633" width="576" height="145" rx="18" fill="#222A31" stroke="#35414B"/>
    <text x="64" y="666" font-size="22" font-weight="400" fill="#A6CDBE">Shadow</text>
    <text x="64" y="711" font-size="28" font-weight="400" fill="#E7ECEF">Confirm: dermatology, 10 miles,</text>
    <text x="64" y="751" font-size="28" font-weight="400" fill="#E7ECEF">weekday mornings, ExamplePlan.</text>
    <rect x="104" y="802" width="576" height="105" rx="18" fill="#253331" stroke="#35414B"/>
    <text x="128" y="835" font-size="22" font-weight="400" fill="#AAB6BF">You</text>
    <text x="128" y="880" font-size="28" font-weight="400" fill="#E7ECEF">Yes, search.</text>
    <rect x="40" y="931" width="576" height="105" rx="18" fill="#222A31" stroke="#35414B"/>
    <text x="64" y="964" font-size="22" font-weight="400" fill="#A6CDBE">Shadow</text>
    <text x="64" y="1009" font-size="28" font-weight="400" fill="#E7ECEF">I’ll send options when ready.</text>
    <path d="M40 1064H680" stroke="#35414B"/>
    <text x="40" y="1108" font-size="26" font-weight="400" fill="#AAB6BF">Illustrated · Doctor in early testing</text>
    <text x="40" y="1146" font-size="26" font-weight="400" fill="#AAB6BF">Outreach needs human approval.</text>
  </g>
</svg>
