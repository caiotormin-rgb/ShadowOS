<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">ShadowOS — a little less life admin</title>
  <desc id="desc">A personal open-source project for household tools in familiar chats. Shared groceries, Doctor search in early testing, and owner-only personal records.</desc>
