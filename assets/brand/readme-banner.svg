<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">ShadowOS — a little less life admin</title>
  <desc id="desc">An illustrated voice update, Peguei o leite (I got the milk), marks milk as bought on a shared grocery list.</desc>
  <rect x="1" y="1" width="958" height="518" rx="20" fill="#F7F6F2" stroke="#D7DFDA" stroke-width="2"/>
  <g transform="translate(52 48)">
    <path d="M17 11h20a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H25l-8 6v-6a7 7 0 0 1-7-7V18a7 7 0 0 1 7-7Z" fill="#C9E5DD"/>
    <path d="M11 4h20a7 7 0 0 1 7 7v13a7 7 0 0 1-7 7H19l-8 6v-6a7 7 0 0 1-7-7V11a7 7 0 0 1 7-7Z" fill="#F7F6F2" stroke="#172D3A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M12 14h17M12 21h11" stroke="#246D5D" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="114" y="87" font-size="44" font-weight="700" fill="#172D3A">ShadowOS</text>
    <text x="52" y="217" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#172D3A">A little less</text>
    <text x="52" y="290" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#172D3A">life admin.</text>
    <text x="54" y="363" font-size="28" fill="#51636A">Household tools, in the</text>
    <text x="54" y="402" font-size="28" fill="#51636A">chats we already use.</text>
    <rect x="566" y="142" width="340" height="144" rx="20" fill="#FFFFFF" stroke="#D7DFDA" stroke-width="2"/>
    <g stroke="#51636A" stroke-width="2" stroke-linecap="round" fill="none">
      <rect x="592" y="162" width="10" height="17" rx="5"/>
      <path d="M587 172v3a10 10 0 0 0 20 0v-3M597 185v6M592 191h10"/>
    </g>
    <text x="620" y="183" font-size="22" fill="#51636A">Voice update</text>
    <text x="592" y="242" font-size="32" font-weight="700" fill="#172D3A">“Peguei o leite.”</text>
    <path d="M736 289v28m-7-7 7 7 7-7" fill="none" stroke="#246D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="540" y="329" width="366" height="138" rx="20" fill="#C9E5DD" stroke="#D7DFDA" stroke-width="2"/>
    <text x="566" y="365" font-size="22" fill="#172D3A">Shared grocery list</text>
    <path d="m568 398 8 8 16-17" fill="none" stroke="#246D5D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="605" y="408" font-size="32" font-weight="700" fill="#172D3A">Leite</text>
    <text x="605" y="445" font-size="28" fill="#246D5D">Comprado</text>
  </g>
</svg>
